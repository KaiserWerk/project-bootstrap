name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build linux/amd64
        run: |
          mkdir -p build
          GOOS=linux GOARCH=amd64 go build -o build/pb-linux-amd64 ./cmd/pb

      - name: Build windows/amd64
        run: |
          mkdir -p build
          GOOS=windows GOARCH=amd64 go build -o build/pb-windows-amd64.exe ./cmd/pb

      - name: Build darwin/amd64
        run: |
          mkdir -p build
          GOOS=darwin GOARCH=amd64 go build -o build/pb-darwin-amd64 ./cmd/pb
